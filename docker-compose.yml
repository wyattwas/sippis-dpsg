services:
  php-dev:
    build: docker/php
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    env_file:
      - path: .env
        required: true
    restart: unless-stopped
    depends_on:
      - db-dev

  db-dev:
    image: mariadb:latest
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/db/entrypoint.sql:/docker-entrypoint-initdb.d/1.sql
    restart: unless-stopped

volumes:
  db-data: